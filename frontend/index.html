<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="data:,">
  <title>RAG Chat UI</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex flex-col h-screen">

  <!-- Header -->
  <header class="bg-white shadow p-4 flex items-center justify-between">
    <span class="text-lg font-semibold">RAG Pipeline Chat</span>
    <button
      id="settings-toggle"
      class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1"
    >
      ⚙️ Settings
    </button>
  </header>

  <!-- Collapsible Settings Panel -->
  <div id="settings-panel" class="hidden bg-yellow-50 border-b border-yellow-200 px-4 py-3">
    <p class="text-sm text-yellow-800 mb-2">
      Upload your own OpenAI API key to test the application.
      Your key is stored only in your browser session and is never persisted on the server.
    </p>
    <div class="flex items-center gap-2">
      <label for="api-key-input" class="text-sm font-medium text-gray-700">API Key:</label>
      <input
        id="api-key-input"
        type="password"
        placeholder="sk-..."
        class="flex-1 border rounded px-3 py-1 text-sm focus:outline-none focus:ring"
      />
      <button
        id="api-key-submit"
        class="bg-emerald-600 text-white px-3 py-1 rounded text-sm hover:bg-emerald-700"
      >
        Submit
      </button>
    </div>
    <div id="api-key-status"></div>
  </div>

  <!-- Chat container -->
  <main id="chat" class="flex-1 overflow-y-auto p-4 space-y-3">
    <!-- messages go here -->
  </main>

  <!-- Thinking / loading indicator -->
  <div id="thinking" class="hidden px-4 py-2 text-sm text-gray-500 flex items-center gap-2">
    <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></div>
    <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce [animation-delay:0.1s]"></div>
    <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce [animation-delay:0.2s]"></div>
    <span class="ml-2">Thinking</span>
  </div>

  <!-- Input area -->
  <footer class="bg-white p-4 flex gap-2 border-t">
    <input
      id="input"
      type="text"
      placeholder="Ask something..."
      class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring"
    />
    <button
      onclick="sendMessage()"
      class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
    >
      Send
    </button>
  </footer>

  <script src="app.js"></script>

</body>
</html>
